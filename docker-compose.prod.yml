# 生产 compose（7.6）。与 dev 态 docker-compose.yml 的区别：
#   1. db 不暴露宿主端口（无 "5432:5432" 后门）
#   2. 新增 web 服务（前端 dist + nginx 同源反代），对外只开一个 HTTP 端口
#   3. 所有服务 TZ=Asia/Shanghai + restart=unless-stopped
#   4. 密钥一律来自 env 文件（--env-file），本文件不写任何密钥
#
# 启动：docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
#   （先 cp deploy/env.prod.example .env.prod 并填真实值，见 docs/deploy.md）

name: student-management-prod

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Shanghai
    # 生产不暴露宿主端口：DB 只允许容器网络内部访问（验证：宿主连不上 5432）。
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    init: true
    env_file:
      - .env.prod
    environment:
      # 双角色结构（7.2/7.3 owner 口径）：运行时 app_user（RLS 生效），迁移 owner（DDL/角色管理）。
      DATABASE_URL: postgresql+asyncpg://app_user:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB}
      MIGRATION_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      TZ: Asia/Shanghai
    command: >-
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/db', timeout=2)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
