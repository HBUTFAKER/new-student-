name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: student
          POSTGRES_USER: student
          POSTGRES_PASSWORD: student_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U student -d student"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://app_user:app_user_dev_password@localhost:5432/student
      MIGRATION_DATABASE_URL: postgresql+asyncpg://student:student_dev_password@localhost:5432/student
      APP_DB_PASSWORD: app_user_dev_password
      RUN_DB_TESTS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare local environment
        run: cp .env.example .env

      - name: Build and start containers
        run: docker compose up -d --build

      - name: Verify health endpoints
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "API did not become healthy in time"
              exit 1
            fi
            sleep 2
          done
          test "$(curl --fail --silent http://localhost:8000/health)" = '{"status":"ok"}'
          test "$(curl --fail --silent http://localhost:8000/health/db)" = '{"status":"ok","database":"ok"}'

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop containers
        if: always()
        run: docker compose down -v
