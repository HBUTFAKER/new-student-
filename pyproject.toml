[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "student-management-system"
version = "0.1.0"
description = "多租户学生信息管理系统（管理端 Web + 家长端微信小程序）"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic==1.20.1",
    "asyncpg==0.32.0",
    "fastapi==0.162.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.2",
    "sqlalchemy[asyncio]==2.1.6",
    "uvicorn[standard]==0.54.0",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1",
    "ruff==0.17.3",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
markers = [
    "integration: tests that require a running PostgreSQL instance",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
