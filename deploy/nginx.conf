# 生产 Nginx：静态托管 + 同源反向代理后端 API（026 裁决，后端零 CORS）。
#
# 反代前缀清单 = FastAPI 全部顶层路由前缀，漏一个前缀就是线上 404。
# 前缀来源（app/api/router.py + 各 route 文件）：
#   /health /auth /me /staff /admin /platform           （带 prefix 的 router）
#   /students /parents /teachers /classrooms /bindings /invite-codes
#   /courses /classes /schedule-rules /tenant-holidays /lessons /makeup-lessons
#   /org-config /reports /purchases /ledger /refunds /transfers
#   /docs /redoc /openapi.json                          （FastAPI 自动文档）
# 新增任何顶层路由前缀，必须同步加进下面的 location 正则。
#
# SPA 刷新（history 模式）：前端路由 /classes /reports /staff /platform 与 API 前缀同名，
# 用 Accept 头区分——浏览器导航带 text/html → 回退 index.html；axios/fetch 带
# application/json（或 */*）→ 反代后端。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 上传尺寸放宽：批量导入是 JSON 提交（200 行上限），10m 足够，避免大 body 被拒。
    client_max_body_size 10m;

    # gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # 带 hash 的静态资产长缓存（Vite 产物带内容 hash，可 immutable）。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html 不缓存：SPA 入口，缓存会让发版不生效。
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # API 反向代理：全部顶层路由前缀，原样转发路径到 api 服务。
    location ~ ^/(health|auth|me|staff|admin|platform|students|parents|teachers|classrooms|bindings|invite-codes|courses|classes|schedule-rules|tenant-holidays|lessons|makeup-lessons|org-config|reports|purchases|ledger|refunds|transfers|docs|redoc|openapi\.json)(/|$) {
        # 浏览器导航到与 API 同名的前端路由（/classes /reports /staff /platform）→ 回退 SPA。
        # 判断依据是 Accept 头：浏览器导航带 text/html，axios/fetch 是 application/json 或 */*。
        if ($http_accept ~* "text/html") {
            rewrite ^ /index.html last;
        }
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 报表 / 批量接口耗时较长，超时放宽到 60s。
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # SPA 前端路由回退（history 模式）。未列出的前缀走这里，由前端 NotFoundView 兜底显示 404。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
